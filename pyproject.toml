[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokedex"
version = "0.1.0"
description = "Classificador de Pokémon por imagem com transfer learning (PyTorch)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "imagehash>=4.3",
    "pyyaml>=6.0",
    "kagglehub>=1.0",  # precisa do parâmetro output_dir
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Fase 2. Localmente, instale o torch CPU antes (ver README); no Colab ele já vem instalado.
ml = [
    "torch>=2.2",
    "torchvision>=0.17",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
# Fase 3: interface
app = ["streamlit>=1.45"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # o `ruff format` já cuida do tamanho das linhas; strings longas são ok

[tool.ruff.lint.per-file-ignores]
# Notebooks: imports no meio da célula e variáveis usadas só em comandos `!` são normais.
"notebooks/*" = ["E402", "B007", "B905"]
