[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokedex"
version = "0.1.0"
description = "Classificador de Pokémon por imagem com transfer learning (PyTorch)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "imagehash>=4.3",
    "pyyaml>=6.0",
    "kagglehub>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Fase 2 (pesado, instalar só quando chegar lá):
# ml = ["torch", "torchvision", "scikit-learn", "matplotlib", "seaborn"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
