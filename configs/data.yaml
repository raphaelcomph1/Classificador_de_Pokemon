# Configuração da Fase 1 (dados)
dataset_handle: lantian773030/pokemonclassification
# Pasta base dos dados. A variável de ambiente POKEDEX_DATA_ROOT, se existir, tem prioridade
# (útil para guardar os dados fora do OneDrive ou apontar para o Drive no Colab).
data_root: data
raw_dir: raw              # relativo a data_root
processed_dir: processed  # relativo a data_root
report_path: docs/dados.md

seed: 42

# Duplicatas: distância de Hamming máxima entre pHashes (64 bits) para
# considerar duas imagens "quase duplicatas". 0 = pHash idêntico.
near_duplicate_max_distance: 4

# Exclusões (marcadas no manifesto; nada é apagado de raw/)
# Formas regionais (ex.: Alolan Sandslash) são classes próprias; ver docs/decisoes.md.
excluded_classes: []
# Mesma imagem em pastas diferentes (ex.: Pidgeot/Pidgeotto) = rótulo ambíguo -> remove o grupo todo.
drop_cross_class_duplicates: true
# Duplicatas na mesma classe: mantém só a de maior resolução (evita vazamento entre splits).
keep_one_per_duplicate_group: true

# Imagens menores que isso (em qualquer lado, em px) são sinalizadas no relatório.
min_side_px: 32

# Split (usado depois, na etapa de split)
split:
  train: 0.70
  val: 0.15
  test: 0.15
